<!DOCTYPE html>
<html lang="az">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gülüm üçün Özəl ❤️</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: "Segoe UI", Arial, sans-serif;
}

html, body {
    width: 100%;
    min-height: 100%;
}

body {
    min-height: 100vh;
    overflow-x: hidden;
    color: white;
    background:
        radial-gradient(circle at 50% 20%, rgba(100,70,180,.18), transparent 35%),
        linear-gradient(180deg, #02030d 0%, #0b1025 50%, #071a22 100%);
    padding: 20px 14px 130px;
    position: relative;
}

/* AY */
.moon {
    position: fixed;
    top: 28px;
    right: 25px;
    width: 72px;
    height: 72px;
    border-radius: 50%;
    background: #fffbea;
    box-shadow:
        0 0 20px #fff8c7,
        0 0 50px rgba(255,248,199,.5),
        0 0 90px rgba(255,248,199,.2);
    z-index: 1;
}

/* ULDUZLAR */
#stars {
    position: fixed;
    inset: 0;
    overflow: hidden;
    pointer-events: none;
    z-index: 0;
}

.star {
    position: absolute;
    background: white;
    border-radius: 50%;
    box-shadow: 0 0 7px white;
    animation: twinkle var(--speed) infinite ease-in-out;
}

@keyframes twinkle {
    0%,100% {
        opacity: .15;
        transform: scale(.7);
    }

    50% {
        opacity: 1;
        transform: scale(1.3);
    }
}

/* AXAN ULDUZ */
.shooting-star {
    position: fixed;
    width: 2px;
    height: 90px;
    background: linear-gradient(transparent, white);
    transform: rotate(45deg);
    opacity: 0;
    z-index: 1;
    animation: shooting 5s linear infinite;
}

@keyframes shooting {
    0% {
        opacity: 0;
        transform: translate(0,0) rotate(45deg);
    }

    10% {
        opacity: 1;
    }

    25% {
        opacity: 0;
        transform: translate(-350px,350px) rotate(45deg);
    }

    100% {
        opacity: 0;
    }
}

/* ƏSAS KART */
.card {
    position: relative;
    z-index: 10;

    width: 100%;
    max-width: 480px;
    margin: 75px auto 0;

    padding: 28px 20px;

    text-align: center;

    background: rgba(255,255,255,.08);
    border: 1px solid rgba(255,255,255,.2);
    border-radius: 30px;

    backdrop-filter: blur(18px);
    -webkit-backdrop-filter: blur(18px);

    box-shadow:
        0 15px 50px rgba(0,0,0,.55),
        inset 0 0 25px rgba(255,255,255,.03);

    animation: cardIn 1.2s ease;
}

@keyframes cardIn {
    from {
        opacity: 0;
        transform: translateY(30px) scale(.96);
    }

    to {
        opacity: 1;
        transform: translateY(0) scale(1);
    }
}

h1 {
    color: #ffeaa7;
    font-size: 25px;
    line-height: 1.3;
    text-shadow: 0 0 15px rgba(255,234,167,.7);
    margin-bottom: 10px;
}

.subtitle {
    color: #f1f2f6;
    font-size: 16px;
    margin-bottom: 13px;
}

.infinity-date {
    color: #ff7675;
    font-size: 19px;
    font-weight: bold;
    letter-spacing: 2px;
    text-shadow: 0 0 12px rgba(255,118,117,.6);
    margin-bottom: 23px;
}

/* TAYMER */
.timer-title {
    color: #b8c1d1;
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 1px;
    margin-bottom: 9px;
}

.timer {
    display: flex;
    justify-content: space-between;
    gap: 5px;

    padding: 13px 8px;
    margin-bottom: 22px;

    background: rgba(0,0,0,.35);
    border: 1px solid rgba(255,255,255,.1);
    border-radius: 19px;
}

.time-box {
    flex: 1;
}

.time-number {
    display: block;
    color: #ff9ff3;
    font-size: 20px;
    font-weight: bold;
    text-shadow: 0 0 8px rgba(255,159,243,.4);
}

.time-label {
    display: block;
    margin-top: 3px;
    color: #aab1bd;
    font-size: 10px;
}

/* DÜYMƏLƏR */
.buttons {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
    margin-bottom: 20px;
}

.btn {
    border: none;
    outline: none;
    padding: 14px 8px;

    color: white;
    font-size: 14px;
    font-weight: 600;

    border-radius: 17px;
    cursor: pointer;

    transition: .25s;
    box-shadow: 0 5px 15px rgba(0,0,0,.2);
}

.btn:active {
    transform: scale(.94);
}

.btn1 {
    background: linear-gradient(135deg,#ff4757,#ff6b81);
}

.btn2 {
    background: linear-gradient(135deg,#a55eea,#8854d0);
}

.btn3 {
    background: linear-gradient(135deg,#ff7675,#d63031);
}

.btn4 {
    background: linear-gradient(135deg,#f6b93b,#e58e26);
}

/* MESAJ */
.message-box {
    min-height: 85px;

    display: flex;
    align-items: center;
    justify-content: center;

    padding: 15px;

    border-radius: 18px;

    background: rgba(0,0,0,.28);
    border: 1px dashed rgba(255,255,255,.2);

    color: #f5f5f5;
    font-size: 14px;
    line-height: 1.6;

    transition: opacity .35s;
}

/* PAPATYA TARLASI */
.daisy-field {
    position: fixed;
    bottom: 0;
    left: 0;

    width: 100%;
    height: 115px;

    z-index: 5;
    pointer-events: none;

    display: flex;
    align-items: flex-end;
    justify-content: space-around;

    padding: 0 4px;

    background:
        linear-gradient(
            to top,
            rgba(5,35,14,.9),
            rgba(5,35,14,.55),
            transparent
        );
}

.daisy {
    position: relative;
    width: 34px;
    height: 80px;

    transform-origin: bottom center;
    animation: sway 3s ease-in-out infinite alternate;
}

.stem {
    position: absolute;
    bottom: 0;
    left: 50%;

    width: 3px;
    height: 55px;

    background: #3b7d35;
    transform: translateX(-50%);
    border-radius: 5px;
}

.flower {
    position: absolute;
    top: 5px;
    left: 50%;

    width: 30px;
    height: 30px;

    transform: translateX(-50%);
}

.petal {
    position: absolute;

    width: 10px;
    height: 18px;

    left: 10px;
    top: 1px;

    background: white;
    border-radius: 50%;

    transform-origin: 5px 14px;
    box-shadow: 0 0 4px rgba(255,255,255,.6);
}

.center {
    position: absolute;

    width: 10px;
    height: 10px;

    top: 10px;
    left: 10px;

    border-radius: 50%;
    background: #ffd32a;

    z-index: 5;
    box-shadow: 0 0 9px #ffd32a;
}

@keyframes sway {
    from {
        transform: rotate(-5deg);
    }

    to {
        transform: rotate(5deg);
    }
}

/* UÇAN ÜRƏK / PAPATYA */
.floating {
    position: fixed;
    pointer-events: none;
    z-index: 999;

    font-size: 23px;

    animation: floatUp 3s linear forwards;
}

@keyframes floatUp {
    0% {
        opacity: 1;
        transform: translateY(0) scale(.7) rotate(0);
    }

    50% {
        opacity: .9;
        transform: translateY(-45vh) scale(1.2) rotate(180deg);
    }

    100% {
        opacity: 0;
        transform: translateY(-100vh) scale(1.5) rotate(360deg);
    }
}

/* MOBİL */
@media(max-width:360px) {

    .card {
        padding: 24px 14px;
    }

    h1 {
        font-size: 22px;
    }

    .btn {
        font-size: 12px;
    }

    .moon {
        width: 58px;
        height: 58px;
    }
}
</style>
</head>

<body>

<div class="moon"></div>

<div id="stars"></div>

<div class="shooting-star" style="top:8%; right:15%;"></div>

<div class="card">

    <h1>4-cü Ayımız Mübarək Olsun, Sevgilim ❤️</h1>

    <div class="subtitle">
        Yaxşı ki varsan, yaxşı ki həyatımdasan 🤍
    </div>

    <div class="infinity-date">
        03.06.2026 - ∞
    </div>

    <div class="timer-title">
        Birlikdə keçirdiyimiz vaxt
    </div>

    <div class="timer">

        <div class="time-box">
            <span class="time-number" id="days">0</span>
            <span class="time-label">Gün</span>
        </div>

        <div class="time-box">
            <span class="time-number" id="hours">0</span>
            <span class="time-label">Saat</span>
        </div>

        <div class="time-box">
            <span class="time-number" id="minutes">0</span>
            <span class="time-label">Dəqiqə</span>
        </div>

        <div class="time-box">
            <span class="time-number" id="seconds">0</span>
            <span class="time-label">Saniyə</span>
        </div>

    </div>

    <div class="buttons">

        <button class="btn btn1" onclick="showMessage('miss')">
            🌸 Darıxanda
        </button>

        <button class="btn btn2" onclick="showMessage('smile')">
            ✨ Gülümsə
        </button>

        <button class="btn btn3" onclick="showMessage('love')">
            💌 Sözüm Var
        </button>

        <button class="btn btn4" onclick="showMessage('daisy')">
            🌼 Papatya Falı
        </button>

    </div>

    <div class="message-box" id="message">
        Düymələrdən birinə toxun... ❤️
    </div>

</div>

<div class="daisy-field" id="daisyField"></div>

<script>

/* =========================
   ULDUZLAR
========================= */

const stars = document.getElementById("stars");

for(let i = 0; i < 110; i++){

    const star = document.createElement("div");

    star.className = "star";

    const size = Math.random() * 2.5 + 1;

    star.style.width = size + "px";
    star.style.height = size + "px";

    star.style.left = Math.random() * 100 + "vw";
    star.style.top = Math.random() * 100 + "vh";

    star.style.setProperty(
        "--speed",
        (Math.random() * 3 + 2) + "s"
    );

    star.style.animationDelay =
        Math.random() * 3 + "s";

    stars.appendChild(star);
}


/* =========================
   PAPATYA TARLASI
========================= */

const field = document.getElementById("daisyField");

for(let i = 0; i < 18; i++){

    const daisy = document.createElement("div");
    daisy.className = "daisy";

    daisy.style.animationDelay =
        (Math.random() * 2) + "s";

    const stem = document.createElement("div");
    stem.className = "stem";

    const flower = document.createElement("div");
    flower.className = "flower";

    for(let j = 0; j < 8; j++){

        const petal = document.createElement("div");

        petal.className = "petal";

        petal.style.transform =
            `rotate(${j * 45}deg)`;

        flower.appendChild(petal);
    }

    const center = document.createElement("div");
    center.className = "center";

    flower.appendChild(center);

    daisy.appendChild(stem);
    daisy.appendChild(flower);

    field.appendChild(daisy);
}


/* =========================
   TAYMER
========================= */

const startDate =
    new Date("2026-06-03T00:00:00");

function updateTimer(){

    const now = new Date();

    let diff = now - startDate;

    if(diff < 0){
        diff = 0;
    }

    const second = 1000;
    const minute = second * 60;
    const hour = minute * 60;
    const day = hour * 24;

    const days =
        Math.floor(diff / day);

    const hours =
        Math.floor((diff % day) / hour);

    const minutes =
        Math.floor((diff % hour) / minute);

    const seconds =
        Math.floor((diff % minute) / second);

    document.getElementById("days").textContent =
        days;

    document.getElementById("hours").textContent =
        hours;

    document.getElementById("minutes").textContent =
        minutes;

    document.getElementById("seconds").textContent =
        seconds;
}

updateTimer();

setInterval(updateTimer, 1000);


/* =========================
   MESAJLAR
========================= */

const messages = {

    miss: [

        "Gülüm, nə qədər uzaqda olsaq da, qəlbim hər an səninlədir. ❤️",

        "Səni düşündüyüm hər an üzümə istər-istəməz təbəssüm gəlir. 🌙",

        "Məsafələr sadəcə məsafədir. Mənim üçün sən həmişə yanımdasan. 🤍",

        "Darıxanda göyə bax... Bəlkə eyni ulduza baxırıq. ✨"

    ],

    smile: [

        "Sənin gülüşün mənim ən sevdiyim səsdir. 😊❤️",

        "İndi gülümsə. Çünki sənə gülümsəmək çox yaraşır. 🌼",

        "Sənin varlığın həyatımın ən gözəl təsadüflərindən biridir. ✨",

        "Gülüşünü heç vaxt itirmə, Gülüm. 🤍"

    ],

    love: [

        "4-cü ayımız mübarək olsun, sevgilim. ❤️",

        "Yaxşı ki varsan, yaxşı ki həyatımdasan. 🤍",

        "03.06.2026 — bizim hekayəmizin ən gözəl başlanğıclarından biri. ♾️",

        "Sən mənim üçün sadəcə bir insan deyil, xüsusi bir dünyasan. ❤️"

    ],

    daisy: [

        "🌼 Papatya deyir ki: Çox sevir! ❤️",

        "🌼 Papatya deyir ki: Səni hər gün daha çox sevir! ✨",

        "🌼 Papatya deyir ki: Cavab dəyişmir — SEVİR! ❤️",

        "🌼 Papatya deyir ki: Bu sevginin sonu yoxdur... ♾️"

    ]
};


/* =========================
   MESAJ GÖSTƏR
========================= */

function showMessage(type){

    const box =
        document.getElementById("message");

    const list = messages[type];

    const random =
        list[Math.floor(Math.random() * list.length)];

    box.style.opacity = "0";

    setTimeout(() => {

        box.textContent = random;

        box.style.opacity = "1";

    }, 250);

    createFloating(type === "daisy" ? "🌼" : "❤️");

}


/* =========================
   UÇAN ELEMENTLƏR
========================= */

function createFloating(icon){

    for(let i = 0; i < 7; i++){

        const element =
            document.createElement("div");

        element.className = "floating";

        element.textContent = icon;

        element.style.left =
            (Math.random() * 90 + 5) + "vw";

        element.style.bottom =
            "20px";

        element.style.animationDuration =
            (Math.random() * 1.5 + 2.5) + "s";

        document.body.appendChild(element);

        setTimeout(() => {

            element.remove();

        }, 4000);
    }
}


/* =========================
   EKRANA TOXUNDUQDA
========================= */

document.addEventListener("click", function(event){

    if(event.target.closest(".btn")){
        return;
    }

    const element =
        document.createElement("div");

    element.className = "floating";

    element.textContent =
        Math.random() > .5 ? "🌼" : "💖";

    element.style.left =
        event.clientX + "px";

    element.style.top =
        event.clientY + "px";

    element.style.animationDuration =
        "2.5s";

    document.body.appendChild(element);

    setTimeout(() => {
        element.remove();
    }, 3000);

});

</script>

</body>
</html>
